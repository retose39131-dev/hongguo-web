<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>红果免费短剧 · Web 版</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="phone">
    <div id="app"></div>
    <nav id="tabbar"></nav>
    <div class="sheet-mask" id="sheetMask"></div>
    <div class="sheet" id="commentSheet">
      <div class="sheet-head"><h3>评论</h3><button class="icon-btn" data-act="closeComments" style="color:var(--txt2)">✕</button></div>
      <div class="sheet-body" id="commentList"></div>
      <div class="comment-input">
        <input id="commentInput" placeholder="说点什么…" maxlength="80">
        <button class="btn-red" data-act="sendComment">发送</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
